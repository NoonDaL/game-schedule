<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 일정</title>
<meta name="description" content="명조·스타레일·원신·젠레스·이환·엔드필드·리버스·퍼니싱·아주르 프로밀리아의 픽업 배너와 특별방송을 한곳에서.">
<meta name="theme-color" content="#0c0c0f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>

<nav class="nav" aria-label="주 메뉴">
  <a class="brand" href="index.html"><img class="brand-mark" src="favicon.svg" alt="" width="28" height="28">게임 일정</a>
  <div class="nav-links">
    <a href="index.html" aria-current="page">홈</a>
    <a href="schedule.html">전체 일정</a>
    <a class="opt" href="#games">게임</a>
    <a class="opt" href="#launches">출시 예정</a>
  </div>
  <a class="btn btn-main btn-sm" href="#subscribe"><i class="ph ph-calendar-plus"></i>캘린더 구독</a>
</nav>

<main>
  <section class="aperture" aria-label="대표 픽업">
    <div class="ap-stick" data-shader>
      <a class="ap-window" id="ap-window" href="schedule.html" aria-label="대표 픽업 자세히"><div class="media"></div><div class="ap-scrim"></div></a>
      <h1 class="ap-title"><span class="w1">픽업</span><span class="w2">일정</span></h1>
      <div class="ap-intro">
        <div class="hero-stats" id="stats" aria-live="polite">
          <div class="stat"><b>-</b><span>진행 중</span></div>
          <div class="stat"><b>-</b><span>이번 주 시작</span></div>
          <div class="stat"><b>-</b><span>마감 임박</span></div>
        </div>
        <div class="hero-cta">
          <a class="btn btn-main" href="schedule.html">전체 일정 <i class="ph ph-arrow-right"></i></a>
          <a class="btn btn-ghost" href="#subscribe">캘린더 구독</a>
        </div>
      </div>
      <div class="ap-caption" id="ap-caption"></div>
    </div>
  </section>

  <nav class="marquee" aria-label="게임 바로가기"><div class="track" id="marquee"></div></nav>

  <section class="block" id="stack-sec">
    <div class="wrap">
      <div class="block-head"><h2>신규 픽업</h2></div>
      <div class="stack" id="stack"></div>
    </div>
  </section>

  <section class="block" id="live-sec">
    <div class="wrap">
      <div class="block-head">
        <h2>진행 중<small id="live-count"></small></h2>
        <a class="more" href="schedule.html">전체 일정 <i class="ph ph-arrow-right"></i></a>
      </div>
      <div class="rail" id="live"></div>
    </div>
  </section>

  <section class="block" id="next-sec">
    <div class="wrap">
      <div class="block-head"><h2>다가오는 픽업</h2></div>
      <div class="bento" id="next"></div>
    </div>
  </section>

  <section class="block" id="cast-sec">
    <div class="wrap">
      <div class="block-head"><h2>특별방송</h2></div>
      <div class="panel" id="casts"></div>
    </div>
  </section>

  <section class="block" id="offline-sec">
    <div class="wrap">
      <div class="block-head"><h2>콜라보·행사</h2></div>
      <div class="tickets" id="offline"></div>
    </div>
  </section>

  <section class="block" id="games">
    <div class="wrap">
      <div class="block-head"><h2>게임</h2></div>
      <div class="games" id="game-list"></div>
    </div>
  </section>

  <section class="block" id="launches">
    <div class="wrap">
      <div class="block-head"><h2>출시 예정</h2></div>
      <div class="launches" id="launch-list"></div>
    </div>
  </section>
</main>

<footer class="site" id="subscribe">
  <div class="wrap foot">
    <div class="ics">
      <strong style="color:var(--ink)">캘린더 구독</strong>
      <code>noondal.github.io/game-schedule/schedule.ics</code>
      <button class="btn btn-ghost btn-sm" id="copy-ics" type="button">주소 복사</button>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <span id="updated"></span>
      <a href="../legacy/dashboard.html">이전 화면</a>
    </div>
  </div>
</footer>

<script src="app.js?v=11"></script>
<script src="fx.js?v=11" defer></script>
<script>
(async () => {
  const A = App, D = await A.load();
  const now = D.now;
  const banners = D.events.filter(e => e.type === "banner");
  const live = banners.filter(e => A.isLive(e)).sort((a, b) => a.e - b.e);
  const next = banners.filter(e => A.isUpcoming(e)).sort((a, b) => a.s - b.s);

  // 대표: 가장 최근에 열린, 가로 영상 그림이 있는 진행 중 배너. 없으면 다음 픽업.
  // 화면 가득 열리는 창이라 쇼츠(세로)·아이콘은 피한다.
  const pool = live.filter(e => e.image && e.image.yt && !e.image.short);
  const hero = pool.sort((a, b) => b.s - a.s)[0] || live[0] || next[0];
  if (hero) {
    const win = document.getElementById("ap-window");
    win.href = A.D && hero.url ? hero.url : "schedule.html";
    win.target = "_blank"; win.rel = "noopener";
    win.querySelector(".media").innerHTML = A.media(hero);
    const t = A.timing(hero);
    const cap = document.getElementById("ap-caption");
    cap.setAttribute("style", A.gvar(hero.game));
    cap.innerHTML = `${A.chip(hero.game)}
      <div class="card-title">${A.esc(A.title(hero))}</div>
      <div class="sub"><span>${A.esc(hero.version_name || t.sub)}</span>
        <span class="dd${t.hot ? " hot" : ""}">${A.esc(t.text)}</span></div>
      <a class="btn btn-main btn-sm" href="${A.esc(hero.url || "schedule.html")}" target="_blank" rel="noopener">자세히 <i class="ph ph-arrow-up-right"></i></a>`;
  }

  const weekEnd = A.dayIndex(now) + 7;
  const stats = [live.length, next.filter(e => A.dayIndex(e.s) < weekEnd).length,
                 live.filter(e => e.e - now < 3 * 86400000).length];
  document.querySelectorAll("#stats .stat b").forEach((b, i) => b.textContent = stats[i]);

  // 신규 픽업: 진행 중인 신규 캐릭터 배너를 최근 열린 순으로 쌓는다. 둘 미만이면 쌓을 게 없다.
  const stackItems = live.filter(e => e !== hero && e.new_char).sort((a, b) => b.s - a.s).slice(0, 4);
  const stackEl = document.getElementById("stack");
  if (stackItems.length >= 2) {
    stackEl.innerHTML = stackItems.map((e, i) => {
      const next = i + 1 < stackItems.length ? `--next: --s${i + 2};` : "";
      return `<div class="stack-item" style="--n:${i}; view-timeline-name: --s${i + 1}; ${next}">${A.feature(e)}</div>`;
    }).join("");
  } else {
    document.getElementById("stack-sec").hidden = true;
    stackItems.length = 0;
  }

  // 게임 띠: 같은 목록을 두 번 이어 붙여 끊김 없이 돈다. 두 번째는 보조기기에 숨긴다.
  const tiles = D.order.filter(g => g !== A.MISC && A.meta(g)).map(g => {
    const m = A.meta(g);
    return `<a href="game.html?g=${encodeURIComponent(m.key)}"><img src="${A.esc(m.avatar)}" alt="" loading="lazy">${A.esc(A.short(g))}</a>`;
  }).join("");
  document.getElementById("marquee").innerHTML = tiles
    + `<span class="dup" aria-hidden="true" style="display:contents">${tiles.replaceAll("<a ", '<a tabindex="-1" ')}</span>`;

  const rail = live.filter(e => e !== hero && !stackItems.includes(e));
  document.getElementById("live-count").textContent = live.length ? `${live.length}개` : "";
  document.getElementById("live").innerHTML = rail.map((e, i) => A.card(e, { i })).join("")
    || `<div class="empty">진행 중인 다른 픽업이 없습니다.</div>`;

  // 다가오는 픽업은 다섯 개까지. 칸 수는 항목 수에 맞춘다 (빈 칸을 두지 않는다).
  const window5 = next.slice(0, 8);
  // 큰 칸은 가장 빨리 시작하는 신규. 그림 유무로 고르면 쇼케이스가 아직 없는 신규(케르)가
  // 더 늦은 신규에 밀린다. 그림이 없으면 게임 대표 그림으로 채워진다.
  const lead = window5.find(e => e.new_char) || window5[0];
  const soon = lead ? [lead].concat(next.filter(e => e !== lead).slice(0, 4)) : [];
  const bento = document.getElementById("next");
  const shape = ["", "few", "few", "three", "four"][soon.length];
  if (shape) bento.classList.add(shape);
  bento.innerHTML = soon.map((e, i) => A.card(e, { i })).join("")
    || `<div class="empty">아직 예고된 픽업이 없습니다.</div>`;
  if (!soon.length) document.getElementById("next-sec").hidden = true;

  const in14 = new Date(now.getTime() + 14 * 86400000);
  const casts = D.events.filter(e => e.type === "broadcast" && e.e > now && e.s < in14).sort((a, b) => a.s - b.s).slice(0, 5);
  const offline = D.events.filter(e => e.type === "event" && (e.e || e.s) > now).sort((a, b) => a.s - b.s).slice(0, 6);
  document.getElementById("casts").innerHTML = casts.map((e, i) => A.row(e, i)).join("");
  if (!casts.length) document.getElementById("cast-sec").hidden = true;
  document.getElementById("offline").innerHTML = offline.map((e, i) => A.ticket(e, i)).join("");
  if (!offline.length) document.getElementById("offline-sec").hidden = true;
  A.bindTickets();
  A.bindHolo();
  A.apertureFallback();

  document.getElementById("game-list").innerHTML =
    D.order.filter(g => g !== A.MISC && A.meta(g)).map((g, i) => A.gameTile(g, i)).join("");

  const rank = { day: 0, month: 1, year: 2, none: 3 };
  const launches = D.events.filter(e => e.type === "launch" && (e.date_precision !== "day" || A.dayIndex(e.s) >= A.dayIndex(now)))
    .sort((a, b) => (rank[a.date_precision || "day"] - rank[b.date_precision || "day"]) || (a.s - b.s));
  document.getElementById("launch-list").innerHTML = launches.map((e, i) => A.launchCard(e, i)).join("");
  if (!launches.length) document.getElementById("launches").hidden = true;

  A.footer();
  A.reveal();
})();
</script>
</body>
</html>
