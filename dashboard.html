<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ────────────────────────────────────────────────────────────
     형태 규칙 (하나로 고정, 예외 없음)
       --r-pill  칩·배지·토글처럼 누르는 것        → 완전 라운드
       --r-panel 표·타임라인처럼 내용을 담는 면    → 10px
       --r-mark  데이터 마크                       → 3px
     ──────────────────────────────────────────────────────────── */
  :root {
    color-scheme: light dark;
    --r-pill: 999px;
    --r-panel: 10px;
    --r-mark: 3px;

    /* 라이트 (기본). validate_palette.js 통과 — light, surface #ffffff:
       최악 인접쌍 CVD ΔE 9.1 / 일반시야 22.9.
       aqua·yellow 는 대비 3:1 미만이라 '직접 라벨 + 표 뷰' 로 해소한다
       (레인 이름과 표 뷰가 항상 있으므로 조건 충족). */
    --page:      #f7f7f5;
    --surface:   #ffffff;
    --surface-2: #f1f1ee;
    --grid:      #ebebe7;
    --rule:      #dedeD8;
    --ink:       #16161a;
    --ink-2:     #55555f;
    --ink-muted: #74747e;

    /* 색은 '게임'이 아니라 '일정 유형'에 배정한다 (2026-08-20 변경).
       게임은 개수가 무한히 늘지만 유형은 3개에서 멈추므로, 팔레트 검증을
       한 번 하면 영구히 유효하다. 게임에 배정하면 게임을 추가할 때마다
       색을 새로 만들고 다시 검증해야 하는데, 8색쯤에서 한계가 온다.
       게임은 어차피 레인 라벨과 목록의 게임명 텍스트가 식별하고 있어서
       색이 유일한 단서였던 자리는 없었다.
       ※ 인접쌍이 바뀌었으니 CVD 검증은 한 번 다시 돌려야 한다. */
    --t-pickup:  #2a78d6;   /* 픽업 */
    --t-cast:    #eb6834;   /* 방송 */
    --t-offline: #1baf7a;   /* 오프라인 */
    --t-other:   #8a8a94;   /* 목록에 없는 유형 */

    /* 상태 = 예약 팔레트. 모드와 무관하게 고정, 시리즈로 재사용 금지.
       항상 글리프 + 라벨과 함께 쓴다 (색 단독으로 의미를 지지 않음). */
    --st-good:     #0ca30c;
    --st-warning:  #fab219;
    --st-serious:  #ec835a;
    --st-critical: #d03b3b;

    --kr: "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* 다크. 같은 여덟 색을 어두운 표면에 맞춰 다시 고른 것이지 자동 반전이 아니다.
     validate_palette.js 통과 — dark, surface #141922:
     최악 인접쌍 CVD ΔE 8.4 / 일반시야 19.8 / 전 슬롯 대비 3:1 이상. */
  @media (prefers-color-scheme: dark) {
    :root {
      --page:      #0b0e14;
      --surface:   #141922;
      --surface-2: #1b2230;
      --grid:      #1e2530;
      --rule:      #2a3340;
      --ink:       #e8edf4;
      --ink-2:     #9fb0c4;
      --ink-muted: #8296ab;

      --t-pickup:  #3987e5;
      --t-cast:    #d95926;
      --t-offline: #199e70;
      --t-other:   #7a8799;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page); color: var(--ink); font-family: var(--kr);
    -webkit-font-smoothing: antialiased; line-height: 1.5; padding-bottom: 72px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* ---- 헤더 ---- */
  /* 상단 바만 sticky. 필터까지 붙여두면 좁은 폭에서 3줄로 늘어나
     타임라인 위를 덮어버린다. 필터는 스코프하는 것 위에 있기만 하면 된다. */
  header { border-bottom: 1px solid var(--rule); }
  .hbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: baseline; gap: 14px; padding: 13px 0; flex-wrap: wrap;
    background: color-mix(in srgb, var(--page) 90%, transparent);
    backdrop-filter: blur(12px);
  }
  .brand { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .brand .dot { color: var(--t-pickup); }
  .updated { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  /* ---- 필터: 스코프하는 모든 것 위에 한 줄로. 차트 카드 안에 두지 않는다. ---- */
  .filters {
    display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center;
    padding: 12px 0 14px; border-bottom: 1px solid var(--rule);
  }
  .fgroup { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  /* 필터의 폼 레이블. 섹션 eyebrow 가 아니므로 uppercase·tracking 을 쓰지 않는다
     (그 조합을 곳곳에 뿌리면 페이지 전체가 템플릿처럼 읽힌다). */
  .flabel { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-right: 2px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2);
    background: transparent; border: 1px solid var(--rule); border-radius: var(--r-pill);
    padding: 5px 12px; cursor: pointer; transition: color .14s, border-color .14s, background .14s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-muted); }
  .chip:active { transform: scale(.97); }   /* 눌리는 느낌 */
  .chip[aria-pressed="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--ink-muted); }
  .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--gc, var(--ink-muted));
            opacity: .35; transition: .14s; flex: none; }
  .chip[aria-pressed="true"] .swatch { opacity: 1; }

  /* 검색. 칩과 같은 높이·라운드로 맞춰 필터 줄에 섞이게 한다. */
  .fsearch { margin-left: auto; }
  .qbox {
    font: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: var(--r-pill);
    padding: 5px 12px; width: 190px; max-width: 46vw;
    transition: border-color .14s;
  }
  .qbox::placeholder { color: var(--ink-muted); }
  .qbox:focus { outline: none; border-color: var(--ink-muted); }
  .qhit { font-size: 11px; font-weight: 600; color: var(--ink-muted);
          font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .fsearch { margin-left: 0; width: 100%; }
                              .qbox { flex: 1; max-width: none; } }

  /* ---- 히어로: 뷰당 정확히 하나. 이 도구의 존재 이유 = '언제 끝나나' ---- */
  .now-sec { padding: 26px 0 4px; }
  .sec-label { font-size: 10px; font-weight: 700; color: var(--ink-muted);
               letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px; }
  .hero { display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }
  .hero-fig { display: flex; align-items: baseline; flex: none; }
  .hero-num { font-size: 54px; font-weight: 800; letter-spacing: -.04em; line-height: 1;
              color: var(--ink); }        /* 히어로는 비례숫자 (tabular 금지) */
  .hero-unit { font-size: 20px; font-weight: 700; color: var(--ink-2); margin-left: 2px; }
  .hero-body { min-width: 0; padding-top: 2px; }
  .hero-when { font-size: 13px; color: var(--ink-muted); margin-bottom: 6px; }
  /* 같은 날 마감이 여럿이면 줄줄이 쌓인다 */
  .hero-item { display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
               font-size: 15px; color: var(--ink-2); margin-bottom: 4px; }
  .hero-item .key { width: 3px; height: 15px; border-radius: var(--r-mark);
                    background: var(--gc); flex: none; }
  .hero-item b { color: var(--ink); font-weight: 700; }
  .hero-game { font-size: 12px; color: var(--ink-muted); }
  .hero-none { font-size: 17px; color: var(--ink-2); }

  /* ---- 상태 배지: 색 단독 금지 → 글리프 + 라벨.
         라이트 모드에서 warning 글리프가 흰 바탕에 묻히므로 옅은 배경으로 받쳐준다. ---- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font-size: 11px; font-weight: 700; color: var(--ink-2);
    border-radius: var(--r-pill); padding: 3px 10px;
    background: color-mix(in srgb, var(--sc) 12%, transparent);
  }
  .badge .g { color: var(--sc); font-size: 9px; line-height: 1; }

  /* ---- 활성 목록 ----
     밀도가 높은 화면이라 카드 박스를 쓰지 않는다. 1px 헤어라인이 행을 나누고,
     여백이 묶는다. 박스가 겹칠수록 실제 데이터가 뒤로 밀린다. ---- */
  .active { display: flex; flex-direction: column; margin-top: 14px;
            border-top: 1px solid var(--rule); }
  /* 목록 안의 구분 라벨. 곧 시작 / 진행 중 을 나눈다. */
  .grp { display: flex; align-items: baseline; gap: 8px;
         font-size: 10px; font-weight: 700; color: var(--ink-muted);
         letter-spacing: .08em; padding: 14px 2px 5px;
         border-bottom: 1px solid var(--grid); }
  .grp:first-child { padding-top: 4px; }
  .grp .gd { font-size: 13px; letter-spacing: -.01em; color: var(--ink);
             font-variant-numeric: tabular-nums; }
  .grp .gw { font-size: 12px; font-weight: 600; letter-spacing: 0; }
  .grp .gr { font-size: 10px; color: var(--t-pickup); }
  .grp .gn { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 0; }

  /* D-day. 이 도구의 질문이 '언제 끝나나' 라 숫자를 세운다. */
  .arow .dd { flex: none; text-align: right; min-width: 54px; }
  .arow .dd b { display: block; font-size: 16px; font-weight: 700; line-height: 1.05;
                font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .arow .dd em { display: block; font-style: normal; font-size: 10px;
                 color: var(--ink-muted); margin-top: 1px; }
  @media (max-width: 720px) { .arow .d { display: none; } }

  .arow { display: flex; align-items: center; gap: 12px; padding: 13px 2px;
          border-bottom: 1px solid var(--grid); transition: background .14s; }
  .arow:hover { background: var(--surface-2); }
  .arow .key { width: 3px; height: 20px; border-radius: var(--r-mark);
               background: var(--gc); flex: none; }
  .arow .g  { font-size: 11px; color: var(--ink-muted); width: 96px; flex: none;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .t  { flex: 1; font-size: 14px; font-weight: 600; min-width: 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .ver { font-weight: 500; color: var(--ink-muted); }
  @media (max-width: 720px) { .arow .ver { display: none; } }
  .arow .d  { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums;
              white-space: nowrap; }
  /* 근거 링크. 제목을 밀어내지 않도록 작고 조용하게. */
  /* .t 안에 두면 제목이 길 때 ellipsis 에 같이 잘려서 링크가 사라진다.
     형제로 빼고 flex:none 을 준다. */
  .arow .src { font-size: 11px; font-weight: 500; color: var(--ink-muted);
               text-decoration: none; white-space: nowrap; flex: none;
               border-bottom: 1px solid var(--rule); }
  .arow .src span { margin-left: 2px; }
  .arow .src:hover { color: var(--ink); border-color: currentColor; }
  .tag { font-size: 10px; font-weight: 700; color: var(--ink-muted);
         border: 1px solid var(--rule); border-radius: var(--r-mark);
         padding: 1px 5px; margin-left: 7px; }

  /* 모션: 행이 순서대로 들어온다. 위계를 만드는 용도이지 장식이 아니다. */
  @media (prefers-reduced-motion: no-preference) {
    .arow { animation: rowin .34s cubic-bezier(.16,1,.3,1) both;
            animation-delay: calc(var(--i, 0) * 26ms); }
    @keyframes rowin { from { opacity: 0; transform: translateY(5px); } }
  }

  /* ---- 뷰 전환 ---- */
  .viewbar { display: flex; align-items: center; gap: 10px; margin: 34px 0 14px; flex-wrap: wrap; }
  .toggle { display: inline-flex; border: 1px solid var(--rule);
            border-radius: var(--r-pill); padding: 3px; gap: 2px; }
  .toggle button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2);
                   background: transparent; border: 0; padding: 6px 15px;
                   border-radius: var(--r-pill); cursor: pointer;
                   transition: color .14s, background .14s; }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .toggle button:hover:not([aria-pressed="true"]) { color: var(--ink); }
  .toggle button:active { transform: scale(.97); }

  /* ---- 타임라인 ---- */
  .tl-card { background: var(--surface); border: 1px solid var(--rule);
             border-radius: var(--r-panel); overflow: hidden; }
  .tl-scroll { overflow-x: auto; overflow-y: hidden; }
  .tl-inner { position: relative; }
  .tl-head { position: relative; height: 26px; border-bottom: 1px solid var(--grid); }
  .tl-month { position: absolute; top: 7px; font-size: 11px; font-weight: 700;
              color: var(--ink-2); padding-left: 6px; white-space: nowrap; }
  /* 주 단위 날짜 눈금. 월 라벨보다 한 단계 약하게 둬서 월 경계가 먼저 읽힌다. */
  .tl-day { position: absolute; top: 8px; font-size: 10px; color: var(--ink-muted);
            padding-left: 5px; white-space: nowrap;
            font-variant-numeric: tabular-nums; }
  .tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
  .tl-now  { position: absolute; top: 0; bottom: 0; width: 2px;
             background: color-mix(in srgb, var(--ink) 55%, transparent); z-index: 6; }
  .tl-now::after {
    content: "오늘"; position: absolute; top: 4px; left: 4px; font-size: 10px; font-weight: 700;
    color: var(--page); background: color-mix(in srgb, var(--ink) 78%, transparent);
    padding: 1px 5px; border-radius: var(--r-mark); white-space: nowrap;
  }
  .lane { position: relative; border-top: 1px solid var(--grid); }
  .lane:first-child { border-top: 0; }
  /* margin-left 로 자연 위치를 컨테이너 왼쪽 끝(0)으로 당긴다.
     이게 없으면 float 자연 위치가 .tl-inner 의 padding-left(116px) 뒤라,
     스크롤이 116px 을 넘기 전까지 sticky 가 안 붙는다. 그동안 왼쪽에는
     116px 빈칸이 남고, 이름 칸은 막대 위를 덮은 채 같이 밀린다.
     mask() 도 '이름 칸이 [scrollLeft, scrollLeft+116] 을 덮는다'고 가정하므로
     여기가 어긋나면 라벨 숨김도 같이 틀어진다. */
  .lane-label {
    position: sticky; left: 0; z-index: 8; float: left; width: 116px;
    margin-left: -116px;
    display: flex; align-items: center; gap: 7px; padding: 0 10px;
    background: var(--surface); border-right: 1px solid var(--grid);
    font-size: 12px; font-weight: 700; color: var(--ink-2);   /* 텍스트는 잉크, 색은 옆 스와치가 */
  }
  .lane-label .key { width: 3px; height: 16px; border-radius: var(--r-mark);
                     background: var(--gc); flex: none; }
  .lane-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 마크: 얇게(18px ≤ 24px), 4px 라운드. 인접 마크 사이는 2px 표면 간격으로 분리. */
  .mark { position: absolute; height: 18px; border-radius: var(--r-mark); cursor: default;
          background: var(--gc); z-index: 3; }
  .mark.pred { background: color-mix(in srgb, var(--gc) 14%, transparent);
               border: 1px dashed color-mix(in srgb, var(--gc) 60%, transparent); }
  .mark:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .mlabel { position: absolute; font-size: 11px; font-weight: 600; white-space: nowrap;
            z-index: 4; pointer-events: none; line-height: 18px; }
  .mlabel.on-fill  { color: #0b0e14; }      /* 불투명 마크 위 → 명도로 고름 */
  .mlabel.on-ghost { color: var(--ink-2); } /* 예측(반투명) 마크 위 */
  .mlabel.outside  { color: var(--ink-2); } /* 마크 바깥 */
  /* 방송 = 시점 이벤트. 길이가 없으므로 마름모 마커 + 2px 표면 링. */
  .bc { position: absolute; width: 11px; height: 11px; z-index: 5;
        background: var(--gc); transform: rotate(45deg);
        box-shadow: 0 0 0 2px var(--surface); border-radius: var(--r-mark); }

  /* ---- 표 뷰 (색 단독 인코딩의 WCAG 대응 쌍) ---- */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--rule);
              border-radius: var(--r-panel); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 9px 14px; white-space: nowrap; }
  th { font-size: 12px; font-weight: 700; color: var(--ink-muted);
       border-bottom: 1px solid var(--rule); }
  td { border-top: 1px solid var(--grid); color: var(--ink-2); }
  td.tt { color: var(--ink); font-weight: 600; white-space: normal; min-width: 200px; }
  td.num { font-variant-numeric: tabular-nums; }   /* 세로 정렬되는 열만 tabular */
  .tkey { display: inline-block; width: 9px; height: 9px; border-radius: var(--r-mark);
          background: var(--gc); margin-right: 7px; vertical-align: -1px; }

  /* ---- 범례: 2계열 이상이면 항상 존재 ---- */
  .legend { display: flex; gap: 8px 18px; flex-wrap: wrap; margin: 14px 2px 0;
            font-size: 11px; color: var(--ink-muted); }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .legend .k { width: 14px; height: 8px; border-radius: var(--r-mark); background: var(--gc); }
  .legend .k.pred { background: color-mix(in srgb, var(--ink-muted) 18%, transparent);
                    border: 1px dashed var(--ink-muted); }
  .legend .k.dia { width: 9px; height: 9px; border-radius: var(--r-mark); transform: rotate(45deg);
                   background: var(--ink-muted); }

  /* ---- 툴팁: 값을 여기서만 볼 수 있게 만들지 않는다 (표 뷰가 항상 있음) ---- */
  #tip { position: fixed; z-index: 90; pointer-events: none; opacity: 0; transition: opacity .1s;
         background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-panel);
         padding: 9px 12px; font-size: 12px; color: var(--ink-2); max-width: 300px;
         box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent); }
  #tip .tg { font-size: 10px; color: var(--ink-muted); margin-bottom: 3px; }
  #tip .tt { font-size: 13px; font-weight: 700; color: var(--ink); white-space: normal; }
  #tip .td { margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* 예측이 섞인 데이터라는 사실은 숨기지 않는다. 다만 데이터 자체보다
     앞서지 않도록 잉크 단계만 낮춘다. */
  /* 수집 신호 이상. 실제 상태를 나타내므로 예약된 상태색을 쓴다. */
  .warns { margin-top: 20px; padding: 11px 14px; border-radius: var(--r-panel);
           background: color-mix(in srgb, var(--st-warning) 13%, transparent);
           display: flex; flex-direction: column; gap: 3px;
           font-size: 12.5px; color: var(--ink-2); }
  /* display:flex 가 hidden 속성의 display:none 을 덮어쓴다. 명시적으로 되돌린다. */
  .warns[hidden] { display: none; }
  .warns b { color: var(--ink); font-size: 12px; }


  .notice { margin-top: 14px; font-size: 12px; line-height: 1.6; color: var(--ink-muted);
            max-width: 62ch; }
  .notice b { color: var(--ink-2); font-weight: 700; }

  .empty { color: var(--ink-2); font-size: 14px; padding: 44px 4px; text-align: center; }
  /* 구분자 중간점을 줄줄이 늘어놓지 않는다. 여백이 나눈다. */
  .foot { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--grid);
          display: flex; gap: 20px; flex-wrap: wrap;
          font-size: 11px; color: var(--ink-muted); }
  .foot a { color: var(--ink-2); text-decoration: none; }
  .foot a:hover { color: var(--ink); text-decoration: underline; }
  @media (max-width: 640px) {
    .hero-num { font-size: 44px; }
    /* 게임 이름을 감추면 모바일에서 '무슨 게임인지' 를 알 수 없다. 예전엔
       열이 좁아 감췄지만, 날짜 그룹이 생기면서 행에 남은 단서가 제목뿐이라
       더 치명적이다. 열을 없애는 대신 제목 위 한 줄로 내린다. */
    .arow { flex-wrap: wrap; row-gap: 3px; }
    .arow .g { width: 100%; order: -1; margin-left: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand">게임 일정<span class="dot">.</span></div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="filters">
      <div class="fgroup"><span class="flabel">게임</span><span id="game-chips" style="display:contents"></span></div>
      <div class="fgroup"><span class="flabel">종류</span><span id="type-chips" style="display:contents"></span></div>
      <div class="fgroup"><button class="chip" id="chip-pred" aria-pressed="true">예측 포함</button></div>
      <div class="fgroup fsearch">
        <label class="flabel" for="q">검색</label>
        <input id="q" type="search" class="qbox" placeholder="게임 · 캐릭터 · 버전"
               autocomplete="off" aria-label="게임·캐릭터·버전 검색">
        <span class="qhit" id="qhit" hidden></span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="warns" id="warns" hidden></div>

  <section class="now-sec">
    <div class="sec-label">다음 마감</div>
    <div id="hero"></div>
    <p class="notice">
      공식 발표 전 항목은 <b>추정</b>이라 실제와 다를 수 있습니다.
      참고용으로만 사용하시고, 정확한 일정은 각 게임 공식 공지를 확인해 주세요.
    </p>
  </section>

  <div class="viewbar">
    <div class="toggle" role="group" aria-label="보기 방식">
      <button id="v-timeline" aria-pressed="true">타임라인</button>
      <button id="v-list" aria-pressed="false">리스트</button>
      <button id="v-table" aria-pressed="false">표</button>
    </div>
  </div>

  <div id="view-timeline"></div>
  <div id="view-list" hidden></div>
  <div id="view-table" hidden></div>

  <div class="legend" id="legend"></div>
  <div class="foot">
    <a href="schedule.ics">캘린더 구독(.ics)</a>
    <a href="https://github.com/NoonDaL/game-schedule">GitHub</a>
    <span>6시간마다 자동 갱신</span>
  </div>
</div>

<div id="tip" role="tooltip"></div>

<script>
"use strict";
const DAY = 86400000;

/* 게임 → 색은 '고정 순서'로 배정한다. 필터로 계열 수가 줄어도 재배정하지 않는다
   (Recolor-on-filter 안티패턴). 목록에 없는 게임은 중립 회색으로 접는다. */
/* 게임 순서는 여전히 고정한다 — 레인·범례·표의 정렬이 흔들리면 대조가 어렵다.
   다만 '순서'일 뿐 색은 여기서 나오지 않는다. */
const GAME_ORDER = ["명조: 워더링 웨이브", "붕괴: 스타레일", "이환",
                    "명일방주: 엔드필드", "리버스: 1999"];
/* 색 = 일정 유형. 목록에 없는 유형은 중립 회색으로 접는다. */
const TYPE_COLOR = { banner: "var(--t-pickup)", broadcast: "var(--t-cast)",
                     event: "var(--t-offline)" };
const colorOf = t => TYPE_COLOR[t] || "var(--t-other)";

/* 이 픽업이 어디에 공지됐는지로 연결한다. 라벨은 '근거'(우리가 무엇을 보고
   정했나)가 아니라 링크가 실제로 여는 것을 적는다 — 사용자가 확인하고 싶은 건
   "정말 픽업이 맞나" 이지 우리의 판단 경로가 아니다.
   url_kind 가 없는 예전 데이터는 공지로 본다 (방송은 늘 공지 영상이다). */
const srcLink = e => e.url
  ? `<a class="src" href="${esc(e.url)}" target="_blank" rel="noopener"
        title="${esc(e.url_kind || "공지")} 열기">${esc(e.url_kind || "공지")}<span aria-hidden="true">↗</span></a>`
  : "";

/* 'event' 키는 그대로 두고 라벨만 바꿨다. 실제로 이 타입에 들어오는 건
   manual.json 으로 넣는 콜라보·팝업 같은 오프라인 일정뿐이라 이름을 실제와
   맞춘 것이다. 키를 바꾸면 기존 uid 와 manual.json 항목이 전부 깨진다.
   인게임 이벤트는 COLLECT_HOYO_EVENTS=False 로 애초에 안 모은다. */
const TYPE_LABELS = { banner: "픽업", broadcast: "방송", event: "오프라인" };
/* hint / release / window 는 배너를 만드는 재료라 표시하지 않는다 */
const SHOW_TYPES = new Set(["banner", "broadcast", "event"]);

let EVENTS = [];
const state = load();

function load() {
  const d = { view: "list", games: null, seen: null,
              types: ["banner", "broadcast", "event"], seenTypes: null, pred: true, v: 2 };
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem("gsched2") || "{}"); } catch (e) {}
  Object.assign(d, stored);
  /* 기본 뷰를 타임라인 → 목록으로 바꿨는데, 저장된 선택이 있으면 그게 이겨서
     기존 방문자는 계속 타임라인을 본다. 한 번만 새 기본값으로 되돌린다.
     게임·종류 필터는 사용자가 직접 고른 것이라 건드리지 않는다.
     ※ 병합한 d 가 아니라 stored 를 봐야 한다. d 에는 기본값 v 가 이미 들어
        있어서, 저장본에 v 가 없어도 조건이 참이 되지 않는다 (처음에 그랬다). */
  if (stored.v !== 2) { d.view = "list"; d.v = 2; }
  return d;
}
const save = () => { try { localStorage.setItem("gsched2", JSON.stringify(state)); } catch (e) {} };

const endOf = e => e.end ? new Date(e.end) : new Date(+new Date(e.start) + 90 * 60000);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => `${d.getMonth() + 1}월 ${d.getDate()}일`;
const fmtT = d => `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const drange = e => e.end ? `${fmt(new Date(e.start))} ~ ${fmt(endOf(e))}` : fmtT(new Date(e.start));
/* 버전·배너 이름. 제목이 아니라 맥락이라 조용히 앞에 붙인다.
   명조처럼 이름이 긴 게임이 있어서(「신기루 속 등불 그림자, 속세에 깃든 검의 결심」)
   좁은 화면에서는 CSS 로 감춘다 — 캐릭터 이름이 잘리는 것보다 맥락이 없는 편이 낫다. */
const verTag = e => e.version_name
  ? `<span class="ver">[${esc(e.version_name)}]</span> ` : "";

const shortTitle = e => e.title
  .replace(/^\[(예측|예정|픽업)\]\s*/, "")
  .replace(/^\[배너[^\]]*\]\s*/, "");

/* 타임라인 전용 짧은 라벨. 방송 제목은 '〈붕괴: 스타레일〉 4.5 버전 「…」 프리뷰
   스페셜 프로그램'처럼 길어서 레인을 가로질러 버린다. 버전 번호만으로 충분하고,
   전체 제목은 툴팁과 표 뷰에 그대로 있다. */
const tlLabel = e => e.type === "broadcast"
  ? (e.version ? `v${e.version} 방송` : "특별 방송")
  : shortTitle(e);

/* 상태 = 예약 팔레트. 색 단독으로 의미를 지지 않게 글리프와 라벨을 함께 돌려준다.
   글리프는 모양이 서로 달라서 흑백/CVD 에서도 구분된다. */
function statusOf(e, now) {
  const s = +new Date(e.start), en = +endOf(e);
  if (en < now) return { k: "done", label: "종료", g: "·", c: "var(--ink-muted)" };
  if (s <= now) {
    const d = Math.max(0, Math.ceil((en - now) / DAY));
    if (d <= 2) return { k: "critical", label: "곧 종료", g: "▲", c: "var(--st-critical)", d, ing: true };
    if (d <= 7) return { k: "warning",  label: "종료 임박", g: "◆", c: "var(--st-warning)", d, ing: true };
    return { k: "good", label: "진행 중", g: "●", c: "var(--st-good)", d, ing: true };
  }
  const d = Math.max(0, Math.ceil((s - now) / DAY));
  if (d <= 3) return { k: "soon", label: "곧 시작", g: "◇", c: "var(--st-serious)", d };
  return { k: "future", label: "예정", g: "○", c: "var(--ink-muted)", d };
}
const badge = st => `<span class="badge" style="--sc:${st.c}"><span class="g">${st.g}</span>${st.label}</span>`;

async function init() {
  /* 폰트 로드 전에 measureText 를 쓰면 폭이 어긋나 라벨이 마크를 넘어간다.
     반드시 웹폰트가 준비된 뒤에 첫 렌더를 한다. */
  try { await document.fonts.ready; } catch (e) {}
  let data = null, status = null;
  try { const r = await fetch("events.json", { cache: "no-store" }); if (r.ok) data = await r.json(); } catch (e) {}
  /* '언제 확인했는가' 는 status.json 이 따로 들고 있다. events.json 의
     updated_at 은 내용이 실제로 바뀔 때만 갱신되므로 확인 시각이 아니다. */
  try { const r = await fetch("status.json", { cache: "no-store" }); if (r.ok) status = await r.json(); } catch (e) {}

  EVENTS = Object.entries(data || {})
    .map(([uid, e]) => ({ uid, ...e }))
    .filter(e => SHOW_TYPES.has(e.type) && shortTitle(e).trim() !== "");

  const checked = status && status.checked_at
    ? new Date(status.checked_at)
    : (() => { const u = EVENTS.map(e => e.updated_at).filter(Boolean).sort();
               return u.length ? new Date(u[u.length - 1]) : null; })();
  document.getElementById("updated").textContent =
    !data ? "events.json 연결 대기" : checked ? "확인 " + fmtT(checked) : "";

  /* 수집 신호가 끊기면 조용히 예측으로 떨어질 뿐이라 화면에 드러낸다.
     이게 없으면 몇 달 뒤에야 알아챈다. */
  const warns = (status && status.warnings) || [];
  if (warns.length) {
    const el = document.getElementById("warns");
    el.hidden = false;
    el.innerHTML = `<b>점검 필요</b>` +
      warns.map(w => `<span>${esc(w)}</span>`).join("");
  }

  const games = GAME_ORDER.filter(g => EVENTS.some(e => e.game === g))
    .concat([...new Set(EVENTS.map(e => e.game))].filter(g => !GAME_ORDER.includes(g)));
  /* 나중에 등장한 게임은 기본으로 켠다. 예전엔 state.games 를 최초 1회만
     채워서, 게임이 추가되면 저장된 필터에 영원히 안 들어가 조용히 안 보였다.
     '한 번도 보여준 적 없는 것' 과 '사용자가 끈 것' 을 구분하려고 seen 을 따로 둔다. */
  if (!state.games) state.games = games.slice();
  if (!state.seen) state.seen = state.games.slice();
  const fresh = games.filter(g => !state.seen.includes(g));
  if (fresh.length) {
    state.games = state.games.concat(fresh);
    state.seen = state.seen.concat(fresh);
    save();
  }
  /* 종류도 같은 문제가 있다. 새 종류를 만들었을 때 기존 사용자는 저장된
     types 에 그게 없어서 영구히 안 보였다. */
  if (!state.seenTypes) state.seenTypes = state.types.slice();
  const freshT = Object.keys(TYPE_LABELS).filter(x => !state.seenTypes.includes(x));
  if (freshT.length) {
    state.types = state.types.concat(freshT);
    state.seenTypes = state.seenTypes.concat(freshT);
    save();
  }
  buildChips(games); bindControls(); applyView(); renderAll();
}

function buildChips(games) {
  const gc = document.getElementById("game-chips");
  games.forEach(g => {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", state.games.includes(g));
    // 게임에는 더 이상 색이 없다. 뜻 없는 점은 넣지 않는다.
    b.textContent = g;
    b.onclick = () => { toggle(state.games, g); b.setAttribute("aria-pressed", state.games.includes(g)); save(); renderAll(); };
    gc.appendChild(b);
  });
  const tc = document.getElementById("type-chips");
  Object.entries(TYPE_LABELS).forEach(([t, label]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.style.setProperty("--gc", colorOf(t));
    b.setAttribute("aria-pressed", state.types.includes(t));
    // 색이 유형으로 옮겨왔으므로 점이 여기서 '색 키' 노릇을 한다.
    b.innerHTML = `<span class="swatch"></span>${esc(label)}`;
    b.onclick = () => { toggle(state.types, t); b.setAttribute("aria-pressed", state.types.includes(t)); save(); renderAll(); };
    tc.appendChild(b);
  });
}
function toggle(a, v) { const i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); }

function bindControls() {
  const q = document.getElementById("q");
  const hit = document.getElementById("qhit");
  q.addEventListener("input", () => {
    query = q.value.trim().toLowerCase();
    renderAll();
    // 0건일 때 아무 말이 없으면 '고장' 으로 읽힌다. 걸린 수를 항상 보여준다.
    hit.hidden = !query;
    // visible() 은 지난 일정까지 센다. 화면에 실제로 그려지는 건 '아직 안 끝난'
    // 것뿐이라, 그 수를 세지 않으면 "11건" 이라 해놓고 4줄만 보여주게 된다.
    const n = visible().filter(e => +endOf(e) >= Date.now()).length;
    hit.textContent = query ? `${n}건 일치` : "";
  });
  [["v-timeline", "timeline"], ["v-list", "list"], ["v-table", "table"]].forEach(([id, v]) => {
    document.getElementById(id).onclick = () => { state.view = v; save(); applyView(); renderAll(); };
  });
  const cp = document.getElementById("chip-pred");
  cp.setAttribute("aria-pressed", state.pred);
  cp.onclick = () => { state.pred = !state.pred; cp.setAttribute("aria-pressed", state.pred); save(); renderAll(); };
}
function applyView() {
  [["v-timeline", "view-timeline", "timeline"], ["v-list", "view-list", "list"], ["v-table", "view-table", "table"]]
    .forEach(([btn, box, v]) => {
      document.getElementById(btn).setAttribute("aria-pressed", state.view === v);
      document.getElementById(box).hidden = state.view !== v;
    });
}

/* 검색어는 저장하지 않는다. 남겨두면 다음 방문에 아무것도 안 보이는 화면을
   만나고, 원인이 필터라는 걸 알아채기 어렵다 (칩과 달리 눌린 표시가 없다). */
let query = "";
/* 캐릭터 이름은 chars 에, 버전 이름은 version_name 에 따로 있다. 제목만 훑으면
   "천성" 으로 스타레일 배너를 못 찾는다. */
const haystack = e => [e.game, e.title, e.version_name, e.version,
                       (e.chars || []).join(" ")].filter(Boolean).join(" ").toLowerCase();

const visible = () => EVENTS.filter(e =>
  state.games.includes(e.game) && state.types.includes(e.type)
  && (state.pred || !e.predicted)
  && (!query || haystack(e).includes(query)));

function renderAll() { renderNow(); renderLegend(); ({ timeline: renderTimeline, list: renderList, table: renderTable }[state.view])(); }

/* ---- 히어로 + 활성 목록: '무엇이 중요한가'를 색이 아니라 위치와 상태로 말한다 ---- */
const sameDay = (a, b) => a.getFullYear() === b.getFullYear()
  && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

function renderNow() {
  const now = Date.now();
  const live = visible().filter(e => +endOf(e) >= now)
    .sort((a, b) => +endOf(a) - +endOf(b));
  const ongoing = live.filter(e => +new Date(e.start) <= now);
  const hero = document.getElementById("hero");

  // 진행 중인 게 있으면 '가장 빠른 종료', 없으면 '가장 빠른 시작' 기준.
  const started = ongoing.length > 0;
  const pool = started ? ongoing : live;
  const head = pool[0];

  if (!head) {
    hero.innerHTML = `<div class="hero-none">표시할 일정이 없습니다. 위 필터를 확인해 보세요.</div>`;
  } else {
    const keyOf = e => started ? endOf(e) : new Date(e.start);
    const target = keyOf(head);
    /* 같은 날 마감하는 건 함께 띄운다. 가장 급한 하나만 보여주면
       같은 날 끝나는 나머지를 그대로 놓친다. */
    const group = pool.filter(e => sameDay(keyOf(e), target));
    hero.innerHTML = `<div class="hero">
      <div class="hero-fig">
        <span class="hero-num">${statusOf(head, now).d}</span><span class="hero-unit">일</span>
      </div>
      <div class="hero-body">
        <div class="hero-when">${fmt(target)} ${started ? "종료" : "시작"}</div>
        ${group.map(e => `<div class="hero-item">
            <span class="key" style="--gc:${colorOf(e.type)}"></span>
            <b>${esc(shortTitle(e))}</b>
            <span class="hero-game">${esc(e.game)}</span>
            ${badge(statusOf(e, now))}
          </div>`).join("")}
      </div>
    </div>`;
  }

  /* 예전엔 여기서 요약 목록 10건을 따로 그렸다. 기본 뷰가 목록이 되면서
     같은 항목이 한 화면에 두 번 나오게 돼 걷어냈다. 히어로가 '다음 마감'
     하나만 세우고, 전체 목록은 아래 뷰가 맡는다. */
}

function renderLegend() {
  /* 색이 유형으로 옮겨왔으므로 범례도 유형을 설명한다. 게임은 레인 라벨과
     목록의 게임명이 이미 말해주고 있어서 범례에 다시 적을 이유가 없다.
     칩과 같은 순서로 둔다 — 범례와 필터가 어긋나면 대조가 어렵다. */
  const shown = new Set(visible().map(e => e.type));
  const tl = Object.entries(TYPE_LABELS)
    .filter(([t]) => shown.has(t))
    .map(([t, label]) =>
      `<span class="item"><span class="k" style="--gc:${colorOf(t)}"></span>${esc(label)}</span>`)
    .join("");
  document.getElementById("legend").innerHTML = tl +
    `<span class="item"><span class="k pred"></span>예측</span>` +
    `<span class="item"><span class="k dia"></span>특별방송</span>`;
}

/* ---- 타임라인 ---- */
const PX = 16, BARH = 18, ROWH = 26, PADY = 7, LANE_W = 116;

/* 라벨은 '들어갈 때만' 마크 안에 넣는다. overflow:hidden 으로 잘라내지 않는다. */
let _ctx;
function textW(s, weight = 600, size = 11) {
  if (!_ctx) _ctx = document.createElement("canvas").getContext("2d");
  _ctx.font = `${weight} ${size}px Pretendard, system-ui, sans-serif`;
  return _ctx.measureText(s).width;
}

function renderTimeline() {
  const host = document.getElementById("view-timeline");
  const now = Date.now();
  /* 범위를 고정한다. 예전엔 데이터 최소값까지 늘려서 5월 방송 하나가
     타임라인 전체를 몇 달치로 늘려놨다.
     관심은 '앞으로 뭐가 오나' 에 있으므로 과거는 한 주만 남기고 화면을
     앞날에 쓴다. 지난 일정은 표 뷰에서 볼 수 있다. */
  const min = Math.floor((now - 7 * DAY) / DAY) * DAY;
  const evs = visible().filter(e => +endOf(e) >= min);
  if (!evs.length) { host.innerHTML = `<div class="empty">표시할 일정이 없습니다.</div>`; return; }
  let max = now + 90 * DAY;
  evs.forEach(e => { max = Math.max(max, Math.min(+endOf(e), now + 130 * DAY)); });
  max = Math.ceil(max / DAY) * DAY;

  const W = Math.round((max - min) / DAY) * PX;
  const x = t => ((+t - min) / DAY) * PX;
  const games = GAME_ORDER.filter(g => evs.some(e => e.game === g))
    .concat([...new Set(evs.map(e => e.game))].filter(g => !GAME_ORDER.includes(g)));

  /* 눈금에 날짜를 적는다. 예전엔 월 이름만 있어서 74일 구간에 표시가 3개뿐이었고,
     막대가 20일 시작인지 24일 시작인지 마우스를 올려야 알 수 있었다.
     선은 이미 주 단위로 그어져 있었으니 라벨만 붙인다. */
  /* 눈금 자리를 먼저 모은 뒤 라벨을 고른다. 월 1일과 월요일이 하루 차이로
     붙는 경우가 있어서(8/31 과 9월 1일), 순서대로 그리면 겹친다.
     월 라벨을 우선으로 두고, 그 앞뒤로 너무 가까운 주 눈금은 라벨을 뺀다. */
  const MIN_GAP = 46;                      // px
  const ticks = [];
  for (let d = min; d <= max; d += DAY) {
    const dt = new Date(d);
    const first = dt.getDate() === 1;
    if (!first && dt.getDay() !== 1) continue;
    ticks.push({ px: x(d), first,
                 text: first ? `${dt.getMonth() + 1}월`
                             : `${dt.getMonth() + 1}/${dt.getDate()}` });
  }
  const months = ticks.filter(k => k.first);
  const keep = ticks.filter(k => k.first ||
    months.every(m => Math.abs(m.px - k.px) >= MIN_GAP));
  let head = "", grid = "", lastPx = -Infinity;
  for (const k of ticks) {
    grid += `<div class="tl-grid" style="left:${k.px}px${k.first ? "" : ";opacity:.5"}"></div>`;
  }
  for (const k of keep) {
    if (k.px - lastPx < MIN_GAP) continue;   // 주 눈금끼리도 최소 간격 유지
    head += k.first
      ? `<div class="tl-month" style="left:${k.px}px">${k.text}</div>`
      : `<div class="tl-day" style="left:${k.px}px">${k.text}</div>`;
    lastPx = k.px;
  }

  const lanes = games.map(g => {
    const ge = evs.filter(e => e.game === g).sort((a, b) => +new Date(a.start) - +new Date(b.start));
    const rowEnds = [];
    const placed = ge.map(e => {
      const s = +new Date(e.start), en = +endOf(e);
      let row = rowEnds.findIndex(re => re <= s);
      if (row < 0) { row = rowEnds.length; rowEnds.push(en); } else { rowEnds[row] = en; }
      return { e, row };
    });
    const laneH = Math.max(1, rowEnds.length) * ROWH + PADY;

    /* 같은 행에서 다음 마크가 시작하는 x — 바깥 라벨을 놓을 여유를 재는 데 쓴다 */
    const nextLeft = placed.map(({ e, row }) => {
      const mine = +new Date(e.start);
      const nx = placed.filter(p => p.row === row && +new Date(p.e.start) > mine)
                       .map(p => x(new Date(p.e.start)));
      return nx.length ? Math.min(...nx) : Infinity;
    });

    const marks = placed.map(({ e, row }, idx) => {
      const top = PADY / 2 + row * ROWH;
      const l = Math.max(x(new Date(e.start)), 0);
      const tip = `data-tip="${esc(JSON.stringify({ g: e.game, t: shortTitle(e), d: drange(e), p: !!e.predicted }))}"`;
      const txt = tlLabel(e);
      const gap = nextLeft[idx];

      if (e.type === "broadcast") {
        /* 시점 이벤트 → 마름모 마커. 라벨은 항상 바깥, 다음 마크와 겹치지 않을 때만. */
        const room = gap - (l + 14);
        const lab = textW(txt) <= room
          ? `<div class="mlabel outside" style="left:${l + 14}px;top:${top}px">${esc(txt)}</div>` : "";
        return `<div class="bc" style="--gc:${colorOf(e.type)};left:${l - 5}px;top:${top + 3}px" tabindex="0" ${tip}></div>${lab}`;
      }

      /* 인접 마크는 2px 표면 간격으로 분리한다 (테두리로 나누지 않는다) */
      const w = Math.max(x(endOf(e)) - l - 2, 6);
      const cls = e.predicted ? "mark pred" : "mark";
      let lab = "";
      if (textW(txt) + 18 <= w) {
        // 안에 여유 있게 들어감
        lab = `<div class="mlabel ${e.predicted ? "on-ghost" : "on-fill"}" style="left:${l + 9}px;top:${top}px">${esc(txt)}</div>`;
      } else if (textW(txt) <= gap - (l + w + 8)) {
        // 안엔 안 들어가지만 마크 오른쪽 끝 바깥에 자리가 있음
        lab = `<div class="mlabel outside" style="left:${l + w + 8}px;top:${top}px">${esc(txt)}</div>`;
      }
      // 둘 다 아니면 라벨 없음 — 잘라내지 않는다. 값은 툴팁과 표 뷰에 그대로 있다.
      return `<div class="${cls}" style="--gc:${colorOf(e.type)};left:${l}px;top:${top}px;width:${w}px" tabindex="0" ${tip}></div>${lab}`;
    }).join("");

    return `<div class="lane" style="height:${laneH}px">
      <div class="lane-label" style="--gc:var(--rule);height:${laneH}px"><span class="key"></span><span>${esc(g)}</span></div>
      ${marks}</div>`;
  }).join("");

  host.innerHTML = `<div class="tl-card"><div class="tl-scroll" id="tlscroll">
    <div class="tl-inner" style="width:${W + LANE_W}px;padding-left:${LANE_W}px">
      <div class="tl-head">${head}</div>
      ${grid}
      <div class="tl-now" style="left:${x(now) + LANE_W}px"></div>
      <div style="position:relative">${lanes}</div>
    </div></div></div>`;

  /* 그리드/현재선은 패딩 기준이 달라 좌표를 보정 */
  host.querySelectorAll(".tl-grid").forEach(el => { el.style.left = parseFloat(el.style.left) + LANE_W + "px"; });
  /* 열자마자 '오늘'이 보이게 스크롤 */
  const sc = document.getElementById("tlscroll");
  if (sc) {
    /* 레인 이름 칸(sticky) 뒤로 들어간 라벨은 숨긴다. 앞글자가 잘린 채 보이면
       '깨진 글자'로 읽혀서, 안 보이는 편이 낫다. */
    /* 좌표계 주의: .mlabel 은 .lane(패딩 이후에서 시작) 기준이라 left 에 LANE_W 가
       이미 반영돼 있다. 화면상 위치 = LANE_W + left, sticky 칸이 덮는 구간 =
       [scrollLeft, scrollLeft + LANE_W] → 가려지는 조건은 left < scrollLeft. */
    const labs = [...host.querySelectorAll(".mlabel")];
    const mask = () => labs.forEach(L => {
      L.style.visibility = parseFloat(L.style.left) < sc.scrollLeft + 2 ? "hidden" : "visible";
    });
    sc.addEventListener("scroll", mask, { passive: true });
    sc.scrollLeft = Math.max(0, x(now) - 120);
    mask();
  }
  bindTips(host);
}

/* 날짜 그룹 헤더용. 게임 수가 늘어도 목록이 무너지지 않으려면 '언제' 가
   1차 축이어야 한다. 게임을 축으로 쓰면 게임이 늘수록 세로로 터진다. */
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return +x; };
const dayGap = (from, to) => Math.round((midnight(to) - midnight(from)) / 864e5);
const relDay = n => n === 0 ? "오늘" : n === 1 ? "내일" : n === 2 ? "모레" : "";

/* D-day. 시작 전이면 시작까지, 시작했으면 종료까지 — 이 도구가 답해야 하는
   질문이 그 둘이라 하나로 합치지 않는다. */
const ddayOf = (e, now) => {
  const started = +new Date(e.start) <= now;
  const target = started ? endOf(e) : new Date(e.start);
  return { n: dayGap(now, target), when: started ? "종료" : "시작", target };
};

function renderList() {
  const host = document.getElementById("view-list");
  const now = Date.now();
  const live = visible().filter(e => +endOf(e) >= now);
  if (!live.length) {
    // 검색 중이면 원인이 검색어라는 걸 밝혀야 한다. '일정이 없습니다' 만 뜨면
    // 데이터가 비었다고 오해한다.
    host.innerHTML = query
      ? `<div class="empty">검색어 <b>${esc(query)}</b> 와 맞는 일정이 없습니다.</div>`
      : `<div class="empty">다가오는 일정이 없습니다.</div>`;
    return;
  }

  const running = live.filter(e => +new Date(e.start) <= now)
                      .sort((a, b) => +endOf(a) - +endOf(b));
  const soon = live.filter(e => +new Date(e.start) > now)
                   .sort((a, b) => +new Date(a.start) - +new Date(b.start));

  const row = (e, i) => {
    const st = statusOf(e, now);
    const d = ddayOf(e, now);
    return `<div class="arow" style="--gc:${colorOf(e.type)};--i:${i}">
      <span class="key"></span><span class="g">${esc(e.game)}</span>
      <span class="t">${verTag(e)}${esc(shortTitle(e))}${e.predicted ? '<span class="tag">예측</span>' : ""}</span>
      ${srcLink(e)}<span class="d">${esc(drange(e))}</span>
      <span class="dd"><b>${d.n <= 0 ? "D-DAY" : "D-" + d.n}</b><em>${d.when}</em></span>
      ${badge(st)}</div>`;
  };

  /* 진행 중이 먼저. '지금 뭐가 돌고 있나' 가 '뭐가 올 예정인가' 보다 급하다. */
  let html = running.length
    ? `<div class="grp"><span class="gd">진행 중</span><span class="gr">지금</span>
       <span class="gn">${running.length}건</span></div>`
      + running.map((e, i) => row(e, i)).join("")
    : "";

  let off = running.length, key = null;
  soon.forEach(e => {
    const sd = new Date(e.start);
    const k = midnight(sd);
    if (k !== key) {
      key = k;
      const gap = dayGap(now, sd);
      const n = soon.filter(x => midnight(new Date(x.start)) === k).length;
      const rel = relDay(gap);
      html += `<div class="grp">
        <span class="gd">${String(sd.getMonth() + 1).padStart(2, "0")}-${String(sd.getDate()).padStart(2, "0")}</span>
        <span class="gw">${DOW[sd.getDay()]}요일</span>
        ${rel ? `<span class="gr">${rel}</span>` : ""}
        <span class="gn">${n}건</span></div>`;
    }
    html += row(e, off++);
  });

  host.innerHTML = `<div class="active">${html}</div>`;
}

/* 표 뷰 — 색 인코딩에 기대지 않는 동등한 경로 */
function renderTable() {
  const host = document.getElementById("view-table");
  const now = Date.now();
  const evs = visible().sort((a, b) => +new Date(a.start) - +new Date(b.start));
  if (!evs.length) { host.innerHTML = `<div class="empty">표시할 일정이 없습니다.</div>`; return; }
  const rows = evs.map(e => {
    const st = statusOf(e, now);
    return `<tr>
      <td><span class="tkey" style="--gc:${colorOf(e.type)}"></span>${esc(e.game)}</td>
      <td>${TYPE_LABELS[e.type] || e.type}${e.predicted ? " (예측)" : e.confirmed ? " (확정)" : ""}</td>
      <td class="tt">${esc(shortTitle(e))}</td>
      <td class="num">${fmtT(new Date(e.start))}</td>
      <td class="num">${e.end ? fmtT(endOf(e)) : "없음"}</td>
      <td>${st.g} ${st.label}${st.d != null && st.k !== "done" ? ` (D-${st.d})` : ""}</td>
    </tr>`;
  }).join("");
  host.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>게임</th><th>종류</th><th>제목</th><th>시작</th><th>종료</th><th>상태</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---- 호버/포커스 툴팁 (키보드도 같은 내용을 본다) ---- */
const tip = document.getElementById("tip");
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    const show = ev => {
      const d = JSON.parse(el.dataset.tip);
      tip.innerHTML = `<div class="tg">${esc(d.g)}</div><div class="tt">${esc(d.t)}${d.p ? ' <span class="tag">예측</span>' : ""}</div><div class="td">${esc(d.d)}</div>`;
      tip.style.opacity = 1;
      const r = el.getBoundingClientRect();
      const cx = ev.clientX != null && ev.clientX ? ev.clientX : r.left + r.width / 2;
      tip.style.left = Math.min(cx + 14, innerWidth - tip.offsetWidth - 12) + "px";
      tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + "px";
    };
    el.addEventListener("mouseenter", show);
    el.addEventListener("mousemove", show);
    el.addEventListener("focus", show);
    ["mouseleave", "blur"].forEach(k => el.addEventListener(k, () => { tip.style.opacity = 0; }));
  });
}

init();
</script>
