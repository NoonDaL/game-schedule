<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 일정 | 게임 일정</title>
<meta name="description" content="진행 중인 픽업부터 다음 주 시작하는 배너, 특별방송, 콜라보 행사까지 주 단위로.">
<meta name="theme-color" content="#0c0c0f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="app.css?v=17">
</head>
<body>

<nav class="nav" aria-label="주 메뉴">
  <a class="brand" href="index.html"><img class="brand-mark" src="favicon.svg" alt="" width="28" height="28">게임 일정</a>
  <div class="nav-links">
    <a href="index.html">홈</a>
    <a href="schedule.html" aria-current="page">전체 일정</a>
    <a class="opt" href="index.html#games">게임</a>
    <a class="opt" href="index.html#launches">출시 예정</a>
  </div>
  <a class="nav-sub" href="#subscribe" aria-label="캘린더 구독"><i class="ph ph-calendar-plus"></i><span>캘린더 구독</span></a>
</nav>

<main class="wrap">
  <header class="page-head">
    <h1>전체 일정</h1>
  </header>

  <div class="filters" role="search">
    <div class="chips" id="game-chips" aria-label="게임"></div>
    <div class="filter-row">
      <div class="seg" id="types" aria-label="종류">
        <button type="button" data-t="all" aria-pressed="true">전체</button>
        <button type="button" data-t="banner" aria-pressed="false">픽업</button>
        <button type="button" data-t="broadcast" aria-pressed="false">방송</button>
        <button type="button" data-t="event" aria-pressed="false">행사</button>
      </div>
      <label class="toggle"><input type="checkbox" id="pred" checked> 예측 포함</label>
      <div class="search">
        <i class="ph ph-magnifying-glass"></i>
        <input id="q" type="search" placeholder="캐릭터, 버전, 게임" aria-label="검색">
      </div>
    </div>
  </div>

  <div id="out"><div class="skeleton" style="margin-top:44px"></div></div>
</main>

<footer class="site" id="subscribe">
  <div class="wrap foot">
    <div class="ics">
      <strong style="color:var(--ink)">캘린더 구독</strong>
      <code>noondal.github.io/game-schedule/schedule.ics</code>
      <button class="btn btn-ghost btn-sm" id="copy-ics" type="button">주소 복사</button>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <span id="updated"></span>
      <a href="legacy/dashboard.html">이전 화면</a>
    </div>
  </div>
</footer>

<script src="app.js?v=17"></script>
<script>
(async () => {
  const A = App, D = await A.load();
  const now = D.now;
  const games = D.order;
  const st = {
    off: new Set(A.store.get("off", [])),          // 끈 게임 (기본은 전부 켬)
    type: A.store.get("type", "all"),
    pred: A.store.get("pred", true),
    q: new URLSearchParams(location.search).get("q") || "",
  };
  const qs = new URLSearchParams(location.search).get("g");
  if (qs) { const only = games.find(g => (A.meta(g) || {}).key === qs); if (only) st.off = new Set(games.filter(g => g !== only)); }

  const chips = document.getElementById("game-chips");
  chips.innerHTML = games.map(g => {
    const m = A.meta(g);
    const img = m && m.avatar ? `<img src="${A.esc(m.avatar)}" alt="">` : "";
    return `<button type="button" class="chip${img ? "" : " text"}" data-g="${A.esc(g)}" aria-pressed="${!st.off.has(g)}">${img}${A.esc(A.short(g))}</button>`;
  }).join("");
  chips.addEventListener("click", ev => {
    const b = ev.target.closest(".chip"); if (!b) return;
    const g = b.dataset.g;
    // 전부 켜진 상태에서 누르면 '그 게임만', 그 밖엔 켜고 끄기.
    if (!st.off.size) st.off = new Set(games.filter(x => x !== g));
    else if (st.off.has(g)) st.off.delete(g); else st.off.add(g);
    if (st.off.size === games.length) st.off.clear();
    A.store.set("off", [...st.off]); sync(); render();
  });
  document.getElementById("types").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    st.type = b.dataset.t; A.store.set("type", st.type); sync(); render();
  });
  const pred = document.getElementById("pred");
  pred.checked = st.pred;
  pred.addEventListener("change", () => { st.pred = pred.checked; A.store.set("pred", st.pred); render(); });
  const q = document.getElementById("q");
  q.value = st.q;
  q.addEventListener("input", () => { st.q = q.value.trim(); render(); });

  function sync() {
    chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(!st.off.has(b.dataset.g))));
    document.querySelectorAll("#types button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === st.type)));
  }

  function visible() {
    const needle = st.q.toLowerCase();
    return D.events.filter(e => e.type !== "launch"
      && (e.e || e.s) > now
      && (st.type === "all" || e.type === st.type)
      && (st.pred || !e.predicted)
      && A.gamesOf(e).some(g => !st.off.has(g))
      && (!needle || [e.title, e.game, e.version_name, (e.chars || []).join(" ")].join(" ").toLowerCase().includes(needle)));
  }

  // 주 묶음: 월요일 시작. 진행 중은 맨 위 한 묶음.
  function weekStart(d) {
    const idx = A.dayIndex(d);
    const dow = (new Date(idx * 86400000).getUTCDay() + 6) % 7;
    return idx - dow;
  }
  function weekLabel(ws) {
    const cur = weekStart(now);
    const first = new Date(ws * 86400000), last = new Date((ws + 6) * 86400000);
    const range = `${first.getUTCMonth() + 1}.${first.getUTCDate()} - ${last.getUTCMonth() + 1}.${last.getUTCDate()}`;
    const name = ws === cur ? "이번 주" : ws === cur + 7 ? "다음 주" : `${first.getUTCMonth() + 1}월 ${Math.floor((first.getUTCDate() - 1) / 7) + 1}주`;
    return [name, range];
  }

  function render() {
    const list = visible();
    const live = list.filter(e => A.isLive(e)).sort((a, b) => (a.e || a.s) - (b.e || b.s));
    const later = list.filter(e => A.isUpcoming(e)).sort((a, b) => a.s - b.s);
    const groups = new Map();
    for (const e of later) {
      const k = weekStart(e.s);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    }
    const kind = st.type === "all";
    let html = "";
    if (live.length) html += section("진행 중", `${live.length}개`, live, kind);
    for (const [k, items] of groups) { const [n, r] = weekLabel(k); html += section(n, r, items, kind); }
    document.getElementById("out").innerHTML = html
      || `<div class="empty">조건에 맞는 일정이 없습니다. 게임이나 종류 선택을 넓히면 다른 일정을 확인할 수 있습니다.</div>`;
    A.reveal();
  }
  function section(name, sub, items, kind) {
    return `<section class="week"><div class="week-head"><h2>${A.esc(name)}</h2><span>${A.esc(sub)}</span></div>
      <div class="grid-cards">${items.map((e, i) => A.card(e, { i: i % 8, kind })).join("")}</div></section>`;
  }

  sync(); render(); A.footer(); A.bindHolo();
})();
</script>
</body>
</html>
